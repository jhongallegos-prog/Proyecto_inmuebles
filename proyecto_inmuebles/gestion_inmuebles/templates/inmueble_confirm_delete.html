{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Confirmar Eliminación</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">¿Estás seguro de que deseas eliminar el inmueble <strong>"{{ inmueble.nombre }}"</strong>?</p>
                <p class="text-muted small">Ubicado en {{ inmueble.direccion }}, {{ inmueble.comuna }}. Esta acción no se puede deshacer.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
